<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rebar Sequencer</title>
<script src="https://components.connect.trimble.com/trimble-connect-workspace-api/index.js"></script>
<style>
  :root { font-family: Arial, sans-serif; font-size: 13px; color: #1b1f24; }
  body { margin: 0; padding: 10px; background: #fff; }
  h1 { font-size: 15px; margin: 0 0 6px; }
  h2 { font-size: 13px; margin: 14px 0 6px; border-bottom: 1px solid #d0d5db; padding-bottom: 3px; }
  button { font: inherit; padding: 5px 9px; border: 1px solid #0063a3; background: #0063a3; color: #fff; border-radius: 3px; cursor: pointer; }
  button.sec { background: #fff; color: #0063a3; }
  button.del { background: #fff; color: #b3261e; border-color: #b3261e; }
  button:disabled { opacity: .5; cursor: default; }
  input[type=text], select, textarea { font: inherit; padding: 4px; border: 1px solid #b8bec6; border-radius: 3px; box-sizing: border-box; }
  .row { display: flex; gap: 6px; align-items: center; margin: 5px 0; flex-wrap: wrap; }
  .row label { min-width: 110px; }
  #status { font-size: 12px; color: #55606b; margin: 4px 0; min-height: 16px; }
  .step { display: flex; align-items: center; gap: 5px; padding: 5px; border: 1px solid #d0d5db; border-radius: 3px; margin: 4px 0; }
  .step.active { border-color: #0063a3; background: #e8f2fa; }
  .step input[type=text] { flex: 1; min-width: 60px; }
  .step .cnt { color: #55606b; font-size: 11px; white-space: nowrap; }
  textarea { width: 100%; height: 70px; font-family: monospace; font-size: 11px; }
</style>
</head>
<body>
<h1>Rebar Sequencer</h1>
<div id="status">Starting…</div>

<h2>1. Look of the "not now" rebars</h2>
<div class="row"><label>Grey colour</label><input type="color" id="grey" value="#d3d3d3"></div>
<div class="row"><label>Opacity (%)</label><input type="range" id="opacity" min="1" max="60" value="10"><span id="opacityVal">10</span></div>
<div class="row"><label>Rest of model</label>
  <select id="others"><option value="grey">Light grey + transparent</option><option value="hide">Hide</option><option value="leave">Leave as it is</option></select></div>
<div class="row"><label>Rebars to place</label>
  <select id="activeColor"><option value="reset">Original colour</option><option value="#e8a200">Orange</option><option value="#d62828">Red</option><option value="#0063a3">Blue</option></select></div>
<div class="row"><label>Camera</label>
  <select id="camera"><option value="keep">Keep my camera</option><option value="fit">Zoom to rebars of the step</option></select></div>

<h2>2. Make the steps</h2>
<div class="row">
  <button id="btnAdd">Add selected rebars as new step</button>
</div>
<div class="row">
  <input type="text" id="prop" placeholder="Property name, e.g. ASSEMBLY_STEP" style="width:210px">
  <button id="btnAuto" class="sec">Build steps from property</button>
</div>
<div class="row" style="color:#55606b;font-size:11px">For "from property": first select the whole rebar cage in the 3D view.</div>

<h2>3. Steps</h2>
<div id="list"></div>
<div class="row">
  <button id="btnViews">Create a Connect view for every step</button>
  <button id="btnReset" class="sec">Reset colours</button>
</div>

<h2>Save / load steps (JSON)</h2>
<textarea id="json"></textarea>
<div class="row"><button id="btnExport" class="sec">Show JSON</button><button id="btnImport" class="sec">Load JSON</button></div>

<script>
let API = null;
let steps = [];
let current = -1;
const LS = 'rebarSequencer.steps.v1';
const $ = id => document.getElementById(id);
const log = m => { $('status').textContent = m; };
const sleep = ms => new Promise(r => setTimeout(r, ms));

function save() { try { localStorage.setItem(LS, JSON.stringify(steps)); } catch (e) {} }
function load() { try { const s = localStorage.getItem(LS); if (s) steps = JSON.parse(s); } catch (e) {} }

function hexToRgba(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255, a };
}
function greyColor() { return hexToRgba($('grey').value, Math.round(Number($('opacity').value) / 100 * 255)); }

async function init() {
  load(); render();
  try {
    API = await TrimbleConnectWorkspace.connect(window.parent, () => {}, 30000);
    log('Connected to Trimble Connect.');
  } catch (e) {
    log('Not connected. Open this page as a 3D Viewer extension inside Trimble Connect.');
  }
}

function countOf(step) { return step.items.reduce((n, it) => n + (it.ext && it.ext.length ? it.ext.length : it.rt.length), 0); }

// Turn a stored step into runtime ids that the viewer understands right now
async function resolve(step) {
  const out = [];
  for (const it of step.items) {
    let ids = it.rt;
    if (it.ext && it.ext.length) {
      try {
        const r = await API.viewer.convertToObjectRuntimeIds(it.modelId, it.ext);
        const ok = r.filter(x => x !== undefined && x !== null);
        if (ok.length) ids = ok;
      } catch (e) {}
    }
    out.push({ modelId: it.modelId, objectRuntimeIds: ids });
  }
  return out;
}

// A Tekla rebar group is ONE object that contains the single bars.
// This collects the bars inside the selected group(s) as well.
async function childrenOf(modelId, ids) {
  const tries = [undefined, 4, 5]; // all types, ElementAssembly, Group
  for (const t of tries) {
    try {
      const r = await API.viewer.getHierarchyChildren(modelId, ids, t, true);
      if (r && r.length) return r.map(e => e.id);
    } catch (e) {}
  }
  return [];
}
async function expandSelection(sel) {
  if (!sel) return sel;
  const out = [];
  for (const s of sel) {
    const kids = await childrenOf(s.modelId, s.objectRuntimeIds);
    const all = Array.from(new Set(s.objectRuntimeIds.concat(kids)));
    out.push({ modelId: s.modelId, objectRuntimeIds: all });
  }
  return out;
}

async function storeItems(sel) {
  const items = [];
  for (const s of sel) {
    let ext = [];
    try { ext = await API.viewer.convertToObjectIds(s.modelId, s.objectRuntimeIds); } catch (e) {}
    items.push({ modelId: s.modelId, rt: s.objectRuntimeIds, ext });
  }
  return items;
}

async function addFromSelection() {
  if (!API) return log('Not connected.');
  const sel = await expandSelection(await API.viewer.getSelection());
  if (!sel || !sel.length) return log('Select the rebars of this step in the 3D view first.');
  steps.push({ name: 'Step ' + String(steps.length + 1).padStart(2, '0'), items: await storeItems(sel) });
  save(); render(); log('Step added.');
}

async function buildFromProperty() {
  if (!API) return log('Not connected.');
  const key = $('prop').value.trim().toLowerCase();
  if (!key) return log('Type the property name first.');
  const sel = await expandSelection(await API.viewer.getSelection());
  if (!sel || !sel.length) return log('Select the whole rebar cage first.');
  const groups = new Map(); // value -> Map(modelId -> ids)
  for (const s of sel) {
    for (let i = 0; i < s.objectRuntimeIds.length; i += 300) {
      const chunk = s.objectRuntimeIds.slice(i, i + 300);
      const props = await API.viewer.getObjectProperties(s.modelId, chunk);
      for (const p of props) {
        let val = null;
        for (const set of (p.properties || [])) {
          for (const pr of (set.properties || [])) {
            if (String(pr.name).toLowerCase() === key) val = pr.value;
          }
        }
        if (val === null || val === undefined || val === '') continue;
        const k = String(val);
        if (!groups.has(k)) groups.set(k, new Map());
        const m = groups.get(k);
        if (!m.has(s.modelId)) m.set(s.modelId, []);
        m.get(s.modelId).push(p.id);
      }
    }
  }
  if (!groups.size) return log('No object has a property called "' + $('prop').value + '".');
  const keys = [...groups.keys()].sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
  steps = [];
  for (const k of keys) {
    const sel2 = [...groups.get(k).entries()].map(([modelId, ids]) => ({ modelId, objectRuntimeIds: ids }));
    steps.push({ name: 'Step ' + k, items: await storeItems(sel2) });
  }
  save(); render(); log(steps.length + ' steps built from "' + $('prop').value + '".');
}

function mergeByModel(list) {
  const m = new Map();
  for (const s of list) {
    if (!m.has(s.modelId)) m.set(s.modelId, []);
    m.get(s.modelId).push(...s.objectRuntimeIds);
  }
  return [...m.entries()].map(([modelId, objectRuntimeIds]) => ({ modelId, objectRuntimeIds }));
}

async function applyStep(i) {
  if (!API) return log('Not connected.');
  const v = API.viewer;
  const resolved = [];
  for (const st of steps) resolved.push(await resolve(st));
  const allBars = mergeByModel(resolved.flat());
  const now = mergeByModel(resolved[i]);
  if (!now.some(s => s.objectRuntimeIds.length)) return log('This step contains no objects. Nothing was changed.');

  await v.setObjectState(undefined, { color: 'reset', visible: 'reset' });
  if ($('others').value === 'hide') await v.setObjectState(undefined, { visible: false });
  // every other object (all other rebar groups too): light grey + very transparent
  if ($('others').value === 'grey') await v.setObjectState(undefined, { visible: true, color: greyColor() });
  // every rebar of the cage: light grey + very transparent
  await v.setObjectState({ modelObjectIds: allBars }, { visible: true, color: greyColor() });
  // the rebars to place now: original (or chosen) colour, fully opaque
  const ac = $('activeColor').value;
  await v.setObjectState({ modelObjectIds: now }, { visible: true, color: ac === 'reset' ? 'reset' : ac });
  if ($('camera').value === 'fit') await v.setCamera({ modelObjectIds: now }, { animationTime: 0 });
  current = i; render();
  log('Showing "' + steps[i].name + '".');
}

async function createViews() {
  if (!API) return log('Not connected.');
  if (!steps.length) return log('Make steps first.');
  let made = 0;
  for (let i = 0; i < steps.length; i++) {
    await applyStep(i);
    await sleep(600);
    try {
      await API.view.createView({ name: String(i + 1).padStart(2, '0') + ' - ' + steps[i].name, description: 'Rebar assembly sequence, step ' + (i + 1) + ' of ' + steps.length });
      made++;
    } catch (e) { log('createView failed: ' + (e && e.message ? e.message : e)); return; }
  }
  log(made + ' views created. Find them in the Views panel.');
}

async function resetColours() {
  if (!API) return;
  await API.viewer.setObjectState(undefined, { color: 'reset', visible: 'reset' });
  current = -1; render(); log('Colours and visibility reset.');
}

function render() {
  const box = $('list');
  box.innerHTML = '';
  steps.forEach((s, i) => {
    const d = document.createElement('div');
    d.className = 'step' + (i === current ? ' active' : '');
    d.innerHTML =
      '<span>' + (i + 1) + '</span>' +
      '<input type="text" data-a="name" data-i="' + i + '" value="' + s.name.replace(/"/g, '&quot;') + '">' +
      '<span class="cnt">' + countOf(s) + ' bars</span>' +
      '<button data-a="show" data-i="' + i + '">Show</button>' +
      '<button class="sec" data-a="repl" data-i="' + i + '" title="Replace bars with current selection">Set sel.</button>' +
      '<button class="sec" data-a="up" data-i="' + i + '">↑</button>' +
      '<button class="sec" data-a="down" data-i="' + i + '">↓</button>' +
      '<button class="del" data-a="del" data-i="' + i + '">×</button>';
    box.appendChild(d);
  });
  if (!steps.length) box.textContent = 'No steps yet.';
}

$('list').addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  const i = Number(b.dataset.i), a = b.dataset.a;
  if (a === 'show') await applyStep(i);
  if (a === 'del') { steps.splice(i, 1); current = -1; save(); render(); }
  if (a === 'up' && i > 0) { [steps[i - 1], steps[i]] = [steps[i], steps[i - 1]]; current = -1; save(); render(); }
  if (a === 'down' && i < steps.length - 1) { [steps[i + 1], steps[i]] = [steps[i], steps[i + 1]]; current = -1; save(); render(); }
  if (a === 'repl') {
    const sel = await expandSelection(await API.viewer.getSelection());
    if (!sel || !sel.length) return log('Select rebars in the 3D view first.');
    steps[i].items = await storeItems(sel); save(); render();
  }
});
$('list').addEventListener('change', e => {
  if (e.target.dataset.a === 'name') { steps[Number(e.target.dataset.i)].name = e.target.value; save(); }
});
$('opacity').addEventListener('input', () => { $('opacityVal').textContent = $('opacity').value; });
$('btnAdd').onclick = addFromSelection;
$('btnAuto').onclick = buildFromProperty;
$('btnViews').onclick = createViews;
$('btnReset').onclick = resetColours;
$('btnExport').onclick = () => { $('json').value = JSON.stringify(steps); };
$('btnImport').onclick = () => {
  try { steps = JSON.parse($('json').value); current = -1; save(); render(); log('Steps loaded.'); }
  catch (e) { log('That is not valid JSON.'); }
};

init();
</script>
</body>
</html>
